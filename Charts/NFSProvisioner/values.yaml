
nfs-subdir-external-provisioner:
  nfs:
    server: nfs-server
    path: /srv/nfs/kubedata
    mountOptions:
      - nfsvers=4.1
  
  storageClass:
    name: nfs-client
    defaultClass: true
    reclaimPolicy: Delete
    archiveOnDelete: true

  volumeMounts:
    - name: nfs-subdir-external-provisioner-root
      mountPath: /persistentvolumes
  
  volumes:
    - name: nfs-subdir-external-provisioner-root
      nfs:
        server: nfs-server
        path: /srv/nfs/kubedata